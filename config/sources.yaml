# 3-Tier Indian GST Legal Sources Registry

# Tier 1: Official Government, Statutory & Judicial Sources (Always Searched First)
official_sources:
  - id: cbic_taxinfo
    name: "CBIC Tax Information Portal"
    base_url: "https://taxinformation.cbic.gov.in"
    authority: "Central Board of Indirect Taxes and Customs (CBIC)"
    priority: 1
    document_types:
      - "CGST, IGST, and UTGST Bare Acts"
      - "Updated Rules, Rate & Non-Rate Notifications"
      - "Circulars, Instructions, and Finance Acts"
    domains:
      - "taxinformation.cbic.gov.in"

  - id: cbic_main
    name: "CBIC Official Portal"
    base_url: "https://www.cbic.gov.in"
    authority: "Central Board of Indirect Taxes and Customs (CBIC)"
    priority: 1
    document_types:
      - "Notifications"
      - "Circulars"
      - "Press Releases"
      - "Tariff Schedules"
    domains:
      - "cbic.gov.in"
      - "www.cbic.gov.in"

  - id: gst_council
    name: "GST Council Secretariat"
    base_url: "https://gstcouncil.gov.in"
    authority: "GST Council Secretariat, Ministry of Finance"
    priority: 1
    document_types:
      - "Council Meeting Agendas & Minutes"
      - "Rate Recommendations & GoM Reports"
      - "AAR & AAAR Portal Directory"
    domains:
      - "gstcouncil.gov.in"

  - id: gstn_portal
    name: "Goods and Services Tax Network (GST Portal)"
    base_url: "https://www.gst.gov.in"
    authority: "Goods and Services Tax Network (GSTN)"
    priority: 1
    document_types:
      - "Operational Advisories & System Updates"
      - "Return Filing Guidelines & Monthly Revenue Data"
    domains:
      - "gst.gov.in"
      - "www.gst.gov.in"

  - id: gstn_tutorial
    name: "GST Portal User Manuals & FAQs"
    base_url: "https://tutorial.gst.gov.in"
    authority: "Goods and Services Tax Network (GSTN)"
    priority: 1
    document_types:
      - "Return Filing Manuals"
      - "FAQs & Portal Navigation Guides"
    domains:
      - "tutorial.gst.gov.in"

  - id: gstat_portal
    name: "GST Appellate Tribunal (GSTAT)"
    base_url: "https://gstat.gov.in"
    authority: "GST Appellate Tribunal (GSTAT)"
    priority: 1
    document_types:
      - "GSTAT Judgements & Orders"
      - "Cause Lists, E-Filing Procedures & GSTAT E-Journal"
    domains:
      - "gstat.gov.in"
      - "www.gstat.gov.in"

  - id: india_code
    name: "India Code"
    base_url: "https://www.indiacode.nic.in"
    authority: "Ministry of Law and Justice, Government of India"
    priority: 1
    document_types:
      - "Authenticated Central and State GST Acts"
      - "Subordinate Legislation"
    domains:
      - "indiacode.nic.in"
      - "www.indiacode.nic.in"

  - id: pib_mof
    name: "Press Information Bureau (Ministry of Finance)"
    base_url: "https://pib.gov.in"
    authority: "Press Information Bureau, Government of India"
    priority: 2
    document_types:
      - "Official Government Explainers"
      - "Council Meeting Summaries & Statutory Reform Notes"
    domains:
      - "pib.gov.in"
      - "www.pib.gov.in"

  - id: dgft_portal
    name: "Directorate General of Foreign Trade (DGFT)"
    base_url: "https://www.dgft.gov.in"
    authority: "Directorate General of Foreign Trade, Ministry of Commerce"
    priority: 2
    document_types:
      - "Exports, Imports, LUTs, SEZ & RoDTEP Policy"
    domains:
      - "dgft.gov.in"
      - "www.dgft.gov.in"

  - id: icegate_portal
    name: "ICEGATE Customs Portal"
    base_url: "https://www.icegate.gov.in"
    authority: "Central Board of Indirect Taxes and Customs (ICEGATE)"
    priority: 2
    document_types:
      - "Customs-Integrated IGST Refunds & Shipping Bill Advisories"
    domains:
      - "icegate.gov.in"
      - "www.icegate.gov.in"

  - id: supreme_court
    name: "Supreme Court of India"
    base_url: "https://www.sci.gov.in"
    authority: "Supreme Court of India"
    priority: 1
    document_types:
      - "Judgments"
      - "Orders"
    domains:
      - "sci.gov.in"
      - "www.sci.gov.in"

  - id: high_courts_ecourts
    name: "eCourts Services & High Court Portals"
    base_url: "https://services.ecourts.gov.in"
    authority: "High Courts of Indian States & eCourts"
    priority: 2
    document_types:
      - "Writ Petition Judgments"
      - "Constitutional Validity Challenges"
    domains:
      - "ecourts.gov.in"
      - "services.ecourts.gov.in"
      - "allahabadhighcourt.in"
      - "bombayhighcourt.nic.in"
      - "delhihighcourt.nic.in"
      - "hcmadras.tn.nic.in"
      - "highcourtchd.gov.in"
      - "calcuttahighcourt.gov.in"
      - "karnatakajudiciary.kar.nic.in"
      - "gujarathighcourt.nic.in"

  - id: state_gst_departments
    name: "State Commercial Tax & AAR/AAAR Portals"
    base_url: "https://comtax.up.nic.in"
    authority: "State Commercial Tax Departments & AAR/AAAR"
    priority: 2
    document_types:
      - "State AAR & Appellate AAR Rulings"
      - "SGST Notifications & Orders"
    domains:
      - "comtax.up.nic.in"
      - "mahagst.gov.in"
      - "commercialtax.gujarat.gov.in"
      - "wbcomtax.nic.in"
      - "keralataxes.gov.in"
      - "ctd.tn.gov.in"
      - "tgct.gov.in"
      - "rajasthantax.gov.in"

# Tier 2: Verified Unofficial & Institutional Reliable Sources (Fallback 1)
verified_secondary_sources:
  - id: icai_idtc
    name: "ICAI GST & Indirect Taxes Committee"
    base_url: "https://idtc.icai.org"
    authority: "ICAI - Indirect Taxes Committee"
    priority: 1
    document_types:
      - "Background Material on GST (BGM)"
      - "Annual Return (GSTR-9/9C) Technical Guides & Handbooks"
    domains:
      - "idtc.icai.org"
      - "icai.org"
      - "www.icai.org"

  - id: taxmann_reporter
    name: "Taxmann"
    base_url: "https://www.taxmann.com"
    authority: "Taxmann Research Database"
    priority: 1
    document_types:
      - "Consolidated Amended Statutes"
      - "Headnoted Judicial & AAR Rulings"
    domains:
      - "taxmann.com"
      - "www.taxmann.com"

  - id: taxsutra_reporter
    name: "Taxsutra"
    base_url: "https://www.taxsutra.com"
    authority: "Taxsutra Indirect Tax Intelligence"
    priority: 1
    document_types:
      - "High Court, Supreme Court & Tribunal Orders"
      - "Litigation Trackers & Expert Columns"
    domains:
      - "taxsutra.com"
      - "www.taxsutra.com"

  - id: centax_reporter
    name: "Centax Online"
    base_url: "https://www.centaxonline.com"
    authority: "Centax Indirect Tax Database"
    priority: 2
    document_types:
      - "GST, Customs & Legacy Indirect Tax Jurisprudence"
    domains:
      - "centaxonline.com"
      - "www.centaxonline.com"

  - id: livelaw_reporter
    name: "LiveLaw"
    base_url: "https://www.livelaw.in"
    authority: "Legal Case Reporter (LiveLaw)"
    priority: 2
    document_types:
      - "Live Court Hearings, Interim Stays & Tax Judgments"
    domains:
      - "livelaw.in"
      - "www.livelaw.in"

  - id: barandbench_reporter
    name: "Bar & Bench"
    base_url: "https://www.barandbench.com"
    authority: "Legal Journalism Portal (Bar & Bench)"
    priority: 2
    document_types:
      - "High Court & Supreme Court Tax Reports"
    domains:
      - "barandbench.com"
      - "www.barandbench.com"

  - id: taxo_portal
    name: "TAXO"
    base_url: "https://taxo.online"
    authority: "TAXO Practitioner Research Portal"
    priority: 2
    document_types:
      - "Notification Trackers & Case Summaries"
    domains:
      - "taxo.online"
      - "www.taxo.online"

  - id: cleartax_portal
    name: "ClearTax GST Law & Updates"
    base_url: "https://cleartax.in/s/gst-law-and-updates"
    authority: "ClearTax GST Compliance Portal"
    priority: 3
    document_types:
      - "Compliance Explainers & Rate Trackers"
    domains:
      - "cleartax.in"
      - "www.cleartax.in"

  - id: vinodkothari_portal
    name: "Vinod Kothari Consultants"
    base_url: "https://vinodkothari.com"
    authority: "Vinod Kothari Analytical Articles"
    priority: 3
    document_types:
      - "Deep-Dive Analytical Articles (Corporate Guarantees, Real Estate, Financial Services)"
    domains:
      - "vinodkothari.com"
      - "www.vinodkothari.com"

# Tier 3: Open-Web Fallback Policy (Fallback 2, controlled by ALLOW_UNVERIFIED_FALLBACK in .env)
unverified_fallback_policy:
  blocked_domains: []

# Source Ranking Rules
authority_hierarchy:
  - "Constitution of India"
  - "Supreme Court of India"
  - "CGST / IGST / UTGST / SGST Acts (Statutory Enactments)"
  - "Jurisdictional High Court Judgments"
  - "Other High Courts Judgments"
  - "GST Appellate Tribunal (GSTAT)"
  - "CGST / IGST Rules (Subordinate Legislation)"
  - "Statutory Notifications (CBIC / Central & State Governments)"
  - "CBIC Circulars / Instructions (Binding on Department)"
  - "Appellate Authority for Advance Rulings (AAAR)"
  - "Authority for Advance Rulings (AAR)"
  - "ICAI Indirect Taxes Committee Guidance"
